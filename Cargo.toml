[workspace]
resolver = "2"
members = ["crates/scenario", "crates/fire", "crates/abm", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[workspace.dependencies]
# The PROPAGATOR Rust core is std-only and dependency-free, so it drops in as a
# plain path dependency -- no FFI, no Python at runtime.
propagator-core = { path = "../../fire/propagator/propagator_sim/rust/propagator-core" }

scenario = { path = "crates/scenario" }
fire = { path = "crates/fire" }
abm = { path = "crates/abm" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
# Bevy's window/event stack brings in uuid. Its random UUID implementation
# needs the browser's Web Crypto source when compiling to wasm32.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 1

# The fire core and asset decoding are unusably slow in a debug build.
[profile.dev.package."*"]
opt-level = 3

# Small, slow-to-build artifact for the static web release.  Keeping this as a
# distinct profile means normal desktop release builds retain their defaults.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
