[workspace]
resolver = "2"
members = ["crates/scenario", "crates/fire", "crates/abm", "crates/game", "crates/propagator-core", "crates/behavior", "crates/telemetry", "crates/chat", "crates/demo", "crates/text", "crates/play", "crates/rocca"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[workspace.dependencies]
# Vendored from CIMAFoundation/propagator_sim at a2749c81. Cargo cannot refer
# to a crate in a Git repository subdirectory, so keeping this small std-only
# core here makes CI and GitHub Pages self-contained.
propagator-core = { path = "crates/propagator-core" }

scenario = { path = "crates/scenario" }
fire = { path = "crates/fire" }
abm = { path = "crates/abm" }
behavior = { path = "crates/behavior" }
telemetry = { path = "crates/telemetry" }
chat = { path = "crates/chat" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"

[profile.dev]
opt-level = 1

# The fire core and asset decoding are unusably slow in a debug build.
[profile.dev.package."*"]
opt-level = 3
