[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The wildfire kiosk demo: Bevy front end"

[features]
# Mario (docs/MARIO.md) needs libsm64, a C build: the desktop CI builds leave it out.
default = ["mario"]
mario = ["dep:libsm64-native"]

[dependencies]
scenario.workspace = true
rocca.workspace = true
fire.workspace = true
abm.workspace = true
behavior.workspace = true
anyhow.workspace = true
datafs.workspace = true
libsm64-native = { path = "../libsm64-native", optional = true }
serde.workspace = true
serde_json.workspace = true
bevy = { version = "0.20", default-features = false }
# Only for the timestamp queries of `bench.rs` (QuerySet, RenderPassTimestampWrites are not
# re-exported by bevy::render::render_resource). Same major as Bevy uses.
wgpu = { version = "30", default-features = false }
bevy_egui = { version = "0.43.1", default-features = false, features = ["open_url", "default_fonts", "render"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", default-features = true, features = ["track_location"] }
libc = "0.2"
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Egui supplies the UI; models are our own baked arrays. The browser needs no
# Bevy UI/text renderer, glTF/scene loaders, animation or morph pipelines.
bevy = { version = "0.20", default-features = false, features = [
    "default_app", "std", "bevy_winit", "bevy_gilrs", "webgl2", "png",
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_post_process",
    "bevy_anti_alias", "bevy_gizmos_render", "bevy_audio",
    "tonemapping_luts", "smaa_luts", "ktx2", "zstd_rust",
] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid.workspace = true
getrandom.workspace = true
# rand 0.8 (abm) uses getrandom 0.2; bevy_egui uses getrandom 0.4.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[[bin]]
name = "game"
path = "src/main.rs"
