[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The wildfire kiosk demo: Bevy front end"

[features]
# Mario (docs/MARIO.md) needs libsm64, a C build: the desktop CI builds leave it out.
default = ["mario"]
mario = ["dep:libsm64-native"]

[dependencies]
scenario.workspace = true
rocca.workspace = true
fire.workspace = true
abm.workspace = true
behavior.workspace = true
anyhow.workspace = true
datafs.workspace = true
libsm64-native = { path = "../libsm64-native", optional = true }
serde_json.workspace = true
bevy = { version = "0.14", default-features = true }
wgpu = { version = "0.20", default-features = false }
bevy_egui = { version = "0.28", default-features = false, features = ["open_url", "default_fonts", "render"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid.workspace = true
getrandom.workspace = true

[[bin]]
name = "game"
path = "src/main.rs"
