[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The wildfire kiosk demo: Bevy front end"

[dependencies]
scenario.workspace = true
rocca.workspace = true
fire.workspace = true
abm.workspace = true
behavior.workspace = true
anyhow.workspace = true
datafs.workspace = true
libsm64-native = { path = "../libsm64-native" }
serde_json.workspace = true
bevy = { version = "0.14", default-features = true }
bevy_egui = { version = "0.28", default-features = false, features = ["open_url", "default_fonts", "render"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid.workspace = true
getrandom.workspace = true

# Vista dall'alto dei paesi, per giudicarne il disegno: stessi moduli del gioco.
[[bin]]
name = "game"
path = "src/main.rs"

[[bin]]
name = "town_shot"
path = "src/town_shot.rs"
