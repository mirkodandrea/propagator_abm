[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy front end for the Spotorno wildfire serious game"

[dependencies]
scenario.workspace = true
fire.workspace = true
abm.workspace = true
behavior = { workspace = true, features = ["reflect"] }
telemetry.workspace = true
chat.workspace = true
anyhow.workspace = true
uuid.workspace = true
getrandom.workspace = true
serde_json.workspace = true
bevy = { version = "0.14", default-features = true }
# `manage_clipboard` stays disabled because bevy_egui 0.28's wasm clipboard
# code targets an older web-sys `Navigator::clipboard()` signature. The web
# build installs its own stable paste-event bridge in `web_clipboard.rs`.
bevy_egui = { version = "0.28", default-features = false, features = ["open_url", "default_fonts", "render"] }
egui-snarl = { version = "0.4.4", features = ["serde"] }

# The local control/inspection API (`crate::api`) is a background OS thread
# accepting TCP connections, which wasm32-unknown-unknown has neither -- kept
# target-specific so `game` still builds for web without a `cfg` at every
# call site.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["ClipboardEvent", "DataTransfer", "Document", "EventTarget", "KeyboardEvent", "Window"] }
