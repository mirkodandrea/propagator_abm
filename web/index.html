<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Rocca Ventosa</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d0c6b4; }
      #rocca { display: block; width: 100%; height: 100%; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #222; font: 18px system-ui, sans-serif; pointer-events: none; text-align: center; padding: 0 24px; }
      #loading h1 { margin: 0; font-size: 28px; font-weight: 600; }
      #loading small { font-size: 14px; color: #555; }
      #bar { width: min(420px, 80vw); height: 10px; border-radius: 5px; background: rgba(0, 0, 0, .15); overflow: hidden; }
      #fill { height: 100%; width: 0; background: #b5451b; border-radius: 5px; transition: width .2s; }
      #bar.wait #fill { width: 35%; animation: slide 1.1s ease-in-out infinite alternate; }
      @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
    </style>
  </head>
  <body>
    <main id="game"><canvas id="rocca" tabindex="0"></canvas></main>
    <div id="loading">
      <h1>Rocca Ventosa</h1>
      <div id="bar" class="wait"><div id="fill"></div></div>
      <div id="status">Caricamento del territorio e della simulazione…</div>
    </div>
    <script type="module">
      import init from './game.js';
      const loading = document.querySelector('#loading');
      const bar = document.querySelector('#bar');
      const fill = document.querySelector('#fill');
      const status = document.querySelector('#status');

      // Download the wasm ourselves to show how much has arrived, then hand
      // it to init as a streaming Response. The size is not shown: the
      // Content-Length is the compressed one, the chunks are not.
      async function download(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`${url}: ${response.status}`);
        if (!response.body) return response;
        let loaded = 0;
        const counted = response.body.pipeThrough(new TransformStream({
          transform(chunk, controller) {
            loaded += chunk.length;
            status.textContent = `Scaricati ${(loaded / 1e6).toFixed(1)} MB`;
            controller.enqueue(chunk);
          },
          flush() {
            status.textContent = 'Avvio della simulazione…';
          },
        }));
        return new Response(counted, { headers: response.headers });
      }

      // The keyboard reaches the game only through the focused canvas.
      const canvas = document.querySelector('#rocca');
      canvas.addEventListener('pointerdown', () => canvas.focus());
      const focusCanvas = () => canvas.focus();
      focusCanvas();
      window.addEventListener('focus', focusCanvas);

      // Winit throws this on purpose once the browser's event loop has the
      // game: it is running, not failing.
      const winitControlFlow = 'Using exceptions for control flow, don\'t mind me.';
      init({ module_or_path: download('./game_bg.wasm') }).then(() => { loading.remove(); focusCanvas(); })
        .catch(error => {
          if (String(error).includes(winitControlFlow)) {
            loading.remove();
            focusCanvas();
            return;
          }
          loading.textContent = `Impossibile avviare il gioco: ${error}`;
          console.error(error);
        });
    </script>
  </body>
</html>
