<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Isola di Roccavento</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d0c6b4; }
      #game { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); width: auto; height: auto; }
      body { overscroll-behavior: none; }
      dialog { box-sizing: border-box; width: min(360px, calc(100vw - 32px)); border: 1px solid #fac346; border-radius: 14px; padding: 20px; background: #121418; color: white; font: 18px system-ui; }
      dialog::backdrop { background: #000b; }
      dialog label, dialog input { display: block; width: 100%; box-sizing: border-box; }
      dialog input { margin: 12px 0; padding: 12px; font: 18px system-ui; }
      dialog button { min-height: 44px; padding: 8px 18px; border: 0; border-radius: 8px; background: #fac346; font: 18px system-ui; }
      /* Winit may request a backing-buffer resize; CSS size stays with the
         safe-area container even when its inline pixel dimensions change. */
      #rocca { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #222; font: 18px system-ui, sans-serif; pointer-events: none; text-align: center; padding: 0 24px; }
      #loading h1 { margin: 0; font-size: 28px; font-weight: 600; }
      #loading small { font-size: 14px; color: #555; }
      #bar { width: min(420px, 80vw); height: 10px; border-radius: 5px; background: rgba(0, 0, 0, .15); overflow: hidden; }
      #fill { height: 100%; width: 0; background: #b5451b; border-radius: 5px; transition: width .2s; }
      #rom-toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(560px, 90vw); padding: 10px 16px; border-radius: 10px; background: rgba(20, 20, 20, .85); color: #fff; font: 15px system-ui, sans-serif; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; }
      #rom-toast.on { opacity: 1; }
      #bar.wait #fill { width: 35%; animation: slide 1.1s ease-in-out infinite alternate; }
      @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
    </style>
  </head>
  <body>
    <main id="game"><canvas id="rocca" tabindex="0"></canvas></main>
    <div id="loading">
      <h1>Isola di Roccavento</h1>
      <div id="bar" class="wait"><div id="fill"></div></div>
      <div id="status">Caricamento del territorio e della simulazione…</div>
    </div>
    <div id="rom-toast"></div>
    <dialog id="name-dialog">
      <form method="dialog">
        <label for="player-name">Come ti chiami?</label>
        <input id="player-name" name="name" maxlength="32" autocomplete="given-name" enterkeyhint="done">
        <button type="submit">Continua</button>
      </form>
    </dialog>
    <input id="rom-input" type="file" accept=".z64,.v64,.n64,.rom" hidden>
    <script type="module">
      import init from './game.js';
      // Explicitly opt in; normal visitors retain the real-time kiosk clock.
      if (new URLSearchParams(location.search).get('playtest') === '1') {
        window.roccaPlaytest = { frame: 0, advance_s: 0, elapse_s: 0, state: null };
      }
      const loading = document.querySelector('#loading');
      const bar = document.querySelector('#bar');
      const fill = document.querySelector('#fill');
      const status = document.querySelector('#status');

      // Download the wasm ourselves to show how much has arrived, then hand
      // it to init as a streaming Response. The size is not shown: the
      // Content-Length is the compressed one, the chunks are not.
      async function download(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`${url}: ${response.status}`);
        if (!response.body) return response;
        let loaded = 0;
        const counted = response.body.pipeThrough(new TransformStream({
          transform(chunk, controller) {
            loaded += chunk.length;
            status.textContent = `Scaricati ${(loaded / 1e6).toFixed(1)} MB`;
            controller.enqueue(chunk);
          },
          flush() {
            status.textContent = 'Avvio della simulazione…';
          },
        }));
        return new Response(counted, { headers: response.headers });
      }


      // Easter egg: the Super Mario 64 ROM is not shipped. The visitor picks
      // or drops their own file once; it is kept in this browser (IndexedDB)
      // and handed to the game as `window.marioRom` (big-endian .z64 bytes).
      const toast = document.querySelector('#rom-toast');
      const romInput = document.querySelector('#rom-input');
      let toastTimer;
      function say(text) {
        toast.textContent = text;
        toast.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('on'), 6000);
      }
      const db = () => new Promise((resolve, reject) => {
        const open = indexedDB.open('rocca-ventosa', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('rom');
        open.onsuccess = () => resolve(open.result);
        open.onerror = () => reject(open.error);
      });
      const store = async (mode, run) => {
        const d = await db();
        return new Promise((resolve, reject) => {
          const request = run(d.transaction('rom', mode).objectStore('rom'));
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      };
      // .z64 is the reference; .v64 swaps each byte pair, .n64 reverses each word.
      function toZ64(bytes) {
        if (bytes.length !== 8 * 1024 * 1024) return null;
        const out = new Uint8Array(bytes);
        const magic = (out[0] << 24 | out[1] << 16 | out[2] << 8 | out[3]) >>> 0;
        if (magic === 0x80371240) return out;
        if (magic === 0x37804012) { for (let i = 0; i < out.length; i += 2) [out[i], out[i + 1]] = [out[i + 1], out[i]]; return out; }
        if (magic === 0x40123780) { for (let i = 0; i < out.length; i += 4) { [out[i], out[i + 3]] = [out[i + 3], out[i]]; [out[i + 1], out[i + 2]] = [out[i + 2], out[i + 1]]; } return out; }
        return null;
      }
      async function takeRom(file) {
        const rom = toZ64(new Uint8Array(await file.arrayBuffer()));
        if (!rom) { say('Non è una ROM di Super Mario 64 (USA) da 8 MB.'); return; }
        window.marioRom = rom;
        store('readwrite', s => s.put(rom, 'sm64')).catch(() => {});
        say('ROM caricata.');
      }
      window.marioPickRom = () => romInput.click();
      // the game found the ROM wrong (not the USA release): forget it
      window.marioForgetRom = () => {
        window.marioRom = undefined;
        store('readwrite', s => s.delete('sm64')).catch(() => {});
      };
      romInput.addEventListener('change', () => { if (romInput.files[0]) takeRom(romInput.files[0]); romInput.value = ''; });
      addEventListener('dragover', e => e.preventDefault());
      addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) takeRom(e.dataTransfer.files[0]); });
      // Mario is disconnected: do not load an unused ROM into phone memory.

      // The keyboard reaches the game only through the focused canvas.
      const canvas = document.querySelector('#rocca');
      const nameDialog = document.querySelector('#name-dialog');
      const nameInput = document.querySelector('#player-name');
      window.roccaEditName = name => {
        nameInput.value = name;
        nameDialog.showModal();
        nameInput.focus();
      };
      nameDialog.addEventListener('close', () => {
        window.roccaPlayerName = nameInput.value;
        canvas.focus({ preventScroll: true });
      });
      canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));
      const focusCanvas = () => { if (!nameDialog.open) canvas.focus({ preventScroll: true }); };
      canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        const message = document.createElement('div');
        message.id = 'loading';
        message.style.pointerEvents = 'auto';
        message.style.background = '#d0c6b4';
        message.textContent = 'La grafica è stata interrotta dal browser.';
        const retry = document.createElement('button');
        retry.textContent = 'Ricarica il gioco';
        retry.style.cssText = 'min-height:44px;padding:10px 20px;font:18px system-ui';
        retry.onclick = () => location.reload();
        message.append(retry);
        document.body.append(message);
      });
      focusCanvas();
      window.addEventListener('focus', focusCanvas);

      // Winit throws this on purpose once the browser's event loop has the
      // game: it is running, not failing.
      const winitControlFlow = 'Using exceptions for control flow, don\'t mind me.';
      init({ module_or_path: download('./game_bg.wasm') }).then(() => { loading.remove(); focusCanvas(); })
        .catch(error => {
          if (String(error).includes(winitControlFlow)) {
            loading.remove();
            focusCanvas();
            return;
          }
          loading.textContent = `Impossibile avviare il gioco: ${error}`;
          console.error(error);
        });
    </script>
  </body>
</html>
