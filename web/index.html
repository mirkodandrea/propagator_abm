<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spotorno wildfire incident command</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101820; }
      #spotorno { display: block; width: 100%; height: 100%; outline: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #dce8ed; font: 16px system-ui, sans-serif; pointer-events: none; }
    </style>
  </head>
  <body>
    <main id="game"><canvas id="spotorno" tabindex="0"></canvas></main>
    <div id="loading">Loading the Spotorno incident simulation…</div>
    <script type="module">
      import init from './game.js';
      const loading = document.querySelector('#loading');
      // Winit 0.30 deliberately throws this exception after handing control to
      // the browser event loop. The game is running at that point; it is not a
      // failed wasm initialization.
      const winitControlFlow = 'Using exceptions for control flow, don\'t mind me.';
      init().then(() => loading.remove())
        .catch(error => {
          if (String(error).includes(winitControlFlow)) {
            loading.remove();
            return;
          }
          loading.textContent = `Could not start the simulation: ${error}`;
          console.error(error);
        });
    </script>
  </body>
</html>
